<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Silent renewal</title>
  </head>
  <body>
    <!-- Remember to update sha in CSP if oidc-client-ts import changes -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/oidc-client-ts/2.5.0/browser/oidc-client-ts.min.js"
      integrity="sha512-qd1hPjzzDZ+aMIp6twy8IkVzPFyyaelpN6XxtBPgAENDcVloVmodXKEmpqBDttkIhKnspgv0s2Rdr+x9dhDMPg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      var mgr = new oidc.UserManager({});
      mgr.signinSilentCallback().catch(error => {
        console.error('silent_renew.html error', error);
      });
    </script>
  </body>
</html>
