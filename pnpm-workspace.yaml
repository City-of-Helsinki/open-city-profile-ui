# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

# Allow plugins that lag on peer ranges to load under ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint: "10"

overrides:
  "lodash": "^4.18.1"
  "picomatch": "^4.0.4"
  "@typescript-eslint/typescript-estree>minimatch": "9.0.7"
  "js-cookie": "^3.0.7"
  # Dependabot alerts: force patched transitive versions of dev-only tooling deps
  "shell-quote": "^1.11.0"
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@5": "^5.0.12"
  "immutable": "^5.1.9"
  "fast-uri": "^3.1.8"
  "postcss": "^8.5.26"
  "js-yaml": "^4.3.2"
  "@humanfs/node": "^0.17.0"
  "@fastify/busboy": "^3.2.2"
  "source-map-js": "^1.2.2"
  # hds-react pins postcss-nesting@10, whose postcss-selector-parser@6 has no patched release
  "postcss-nesting>postcss-selector-parser": "^7.1.6"
  "@csstools/selector-specificity>postcss-selector-parser": "^7.1.6"

auditConfig:
  ignoreGhsas:
    # braces: no patched version exists (3.0.3 is latest); only reached via dev-only codegen glob tooling
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  "@swc/core": true
  esbuild: true
  unrs-resolver: true
